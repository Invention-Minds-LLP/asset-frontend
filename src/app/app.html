<div *ngIf="!isNoLayoutRoute(); else loginTemplate" class="app-container" [class.sidebar-collapsed]="isSidebarCollapsed">
  <app-sidebar (collapsedChange)="isSidebarCollapsed = $event"></app-sidebar>
  <div class="content-area">
    <!-- Global notification bell — top right corner -->
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="back-btn" (click)="goBack()" title="Go back" aria-label="Go back">
          <i class="pi pi-arrow-left"></i>
          <span>Back</span>
        </button>
      </div>
      <div class="top-bar-right">
        <div class="notif-bell" (click)="showNotifPanel = !showNotifPanel; loadRecentNotifications()">
          <i class="pi pi-bell"></i>
          <span *ngIf="unreadCount > 0" class="notif-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
        </div>

        <!-- User menu (Settings / Theme / Logout) -->
        <div class="topbar-user-menu">
          <button class="topbar-user-trigger" (click)="showUserMenu = !showUserMenu">
            <img src="/profile.png" alt="Profile" class="topbar-user-logo" />
            <span class="topbar-user-name" *ngIf="name">{{ name }}</span>
            <i class="pi pi-chevron-down chevron" [class.rotated]="showUserMenu"></i>
          </button>

          <div class="topbar-user-dropdown" *ngIf="showUserMenu">
            <button class="topbar-menu-item" (click)="settings(); showUserMenu = false">
              <i class="pi pi-cog"></i>
              <span>Settings</span>
            </button>

            <div class="topbar-menu-theme">
              <input type="checkbox" id="topbarDarkToggle" class="topbarToggleCheckbox" [(ngModel)]="dark"
                (change)="toggleTheme()" />
              <label for="topbarDarkToggle" class="topbarToggleContainer">
                <div class="topbar-toggle-btn"><i class="pi pi-sun"></i><span>Light</span></div>
                <div class="topbar-toggle-btn"><i class="pi pi-moon"></i><span>Dark</span></div>
              </label>
            </div>

            <button class="topbar-menu-item logout" (click)="logout(); showUserMenu = false">
              <i class="pi pi-sign-out"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
      <div class="topbar-menu-overlay" *ngIf="showUserMenu" (click)="showUserMenu = false"></div>
    </div>

    <!-- Notification dropdown panel -->
    <div class="notif-panel" *ngIf="showNotifPanel">
      <div class="notif-panel-header">
        <span class="notif-panel-title">Notifications</span>
        <span *ngIf="unreadCount > 0" class="notif-mark-all" (click)="markAllRead()">Mark all read</span>
      </div>
      <div class="notif-panel-body">
        <div *ngIf="loadingNotifs" class="notif-loading">
          <i class="pi pi-spin pi-spinner"></i> Loading...
        </div>
        <div *ngIf="!loadingNotifs && notifications.length === 0" class="notif-empty">
          <i class="pi pi-check-circle"></i>
          <span>No notifications</span>
        </div>
        <div *ngFor="let n of notifications" class="notif-item" [class.notif-unread]="!n.isRead" (click)="markAsRead(n)">
          <div class="notif-item-dot" *ngIf="!n.isRead"></div>
          <div class="notif-item-content">
            <div class="notif-item-title">{{ getNotifTitle(n) }}</div>
            <div class="notif-item-message">{{ getNotifMessage(n) }}</div>
            <div class="notif-item-time">{{ getNotifTime(n) }}</div>
          </div>
        </div>
      </div>
      <div class="notif-panel-footer" (click)="goToNotifications()">
        View All Notifications
      </div>
    </div>
    <div class="notif-overlay" *ngIf="showNotifPanel" (click)="showNotifPanel = false"></div>

    <router-outlet></router-outlet>
  </div>
</div>
<ng-template #loginTemplate>
  <!-- <app-login></app-login> -->
  <router-outlet></router-outlet>
</ng-template>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
