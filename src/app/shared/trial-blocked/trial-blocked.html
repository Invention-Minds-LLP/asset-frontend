<div class="blocked-wrap">
  <div class="blocked-card">
    <i class="pi pi-clock blocked-icon"></i>
    <h1>Demo access has ended</h1>
    <p class="blocked-message">{{ message }}</p>
    <p class="blocked-note">
      Your data has not been deleted. Once access is renewed, everything will be exactly where you
      left it.
    </p>
    <p-button label="Back to login" icon="pi pi-arrow-left" severity="secondary" [outlined]="true"
              (onClick)="backToLogin()"></p-button>
  </div>
</div>
